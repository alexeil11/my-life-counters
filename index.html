<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./my-life-counters-icon-variant-2.png">
<meta name="theme-color" content="#111111">
<title>Мои цифры</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}
.app{max-width:600px;margin:0 auto;padding:30px 20px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding:4px 2px}
.subtitle{font-size:12px;font-weight:700;color:#8e8e93;letter-spacing:1.5px;margin-bottom:5px}
h1{margin:0;font-size:34px;font-weight:800}
.add-button{width:48px;height:48px;border:none;border-radius:15px;background:#111;color:white;font-size:28px;line-height:1;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
.add-button:active{transform:scale(.92);opacity:.8}
#counters{display:flex;flex-direction:column;gap:14px}
.counter-card{background:#fff;border-radius:24px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:0 6px 24px rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.04);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.counter-card:active{transform:scale(.985)}
.counter-icon{width:56px;height:56px;border-radius:18px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.counter-info{flex:1;min-width:0}
.counter-name{font-size:19px;font-weight:650;margin-bottom:5px}
.counter-value{font-size:36px;font-weight:750;line-height:1;letter-spacing:-1px;transition:transform .15s ease}
.counter-unit{font-size:14px;color:#8e8e93;margin-left:4px}
.counter-stats{margin-top:10px;font-size:13px;line-height:1.5;color:#8e8e93}
.counter-actions{display:flex;align-items:center;gap:8px;margin-top:14px}
.counter-actions button{height:40px;border:none;border-radius:13px;background:#f2f2f7;color:#1c1c1e;font-size:18px;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
.counter-actions button:active{transform:scale(.9);opacity:.7}
.minus-button,.plus-button{flex:1;font-size:22px!important}
.minus-button{background:#f2f2f7!important;color:#1c1c1e}
.plus-button{background:#1c1c1e!important;color:#fff}
.edit-button,.reset-button,.delete-button{width:40px}
.empty-state{text-align:center;padding:80px 20px 60px}
.empty-icon{font-size:58px;margin-bottom:18px}
.empty-state h2{margin:0 0 8px;font-size:24px;font-weight:700}
.empty-state p{color:#8e8e93;margin:0 auto 25px;max-width:260px;line-height:1.4}
.create-button{border:none;background:#111;color:#fff;padding:14px 22px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(8px)}
.modal.hidden{display:none}
.modal-card,.modal-content{width:100%;max-width:420px;background:#fff;border-radius:26px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-card h2,.modal-content h2{margin:0 0 20px;font-size:24px}
.modal-card label{display:block;font-size:13px;font-weight:600;color:#666;margin:15px 0 7px}
.modal-card input,.modal-card select,.modal-content input,.modal-content select{width:100%;height:48px;border:1px solid #e5e5ea;border-radius:14px;padding:0 14px;font-size:16px;background:#f9f9fb;outline:none;margin-bottom:12px}
.modal-card input:focus,.modal-card select:focus,.modal-content input:focus,.modal-content select:focus{border-color:#111;background:#fff}
.modal-buttons{display:flex;gap:10px;margin-top:8px}
.cancel-button,.save-button{flex:1;min-height:46px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
.cancel-button{background:#f2f2f7;color:#333}.save-button{background:#111;color:#fff}
#deleteModal{z-index:1100}#editModal{z-index:1000}
#deleteModal p{margin-bottom:20px;color:#777}
.navigation{display:flex;background:#e5e5ea;border-radius:16px;padding:4px;margin:20px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.nav-button{flex:1;border:0;background:transparent;padding:10px;border-radius:12px;font-size:14px;cursor:pointer;color:#666;transition:all .15s ease}
.nav-button.active{background:#fff;color:#111;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.statistics-screen{padding-bottom:30px}.statistics-screen.hidden{display:none}
.statistics-eyebrow{display:none}.statistics-title{margin-bottom:4px}.statistics-title h2{margin:5px 0 20px;font-size:30px;letter-spacing:-1px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.summary-card{background:#fff;border-radius:22px;padding:18px 10px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.07)}
.summary-card strong{display:block;font-size:30px;font-weight:700;margin-bottom:8px}.summary-card span{display:block;font-size:11px;color:#8e8e93}
.statistics-list h3{font-size:20px;margin-bottom:12px;font-weight:700}
.statistics-row{display:flex;align-items:center;background:#fff;border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.statistics-icon{width:48px;height:48px;border-radius:15px;font-size:25px;display:flex;align-items:center;justify-content:center}
.statistics-name{flex:1}.statistics-name strong{display:block;font-size:15px}.statistics-name span{display:block;margin-top:4px;font-size:11px;color:#8e8e93}
.statistics-name span.achievement-earned{background:#fff4d6;color:#9a6b00;padding:8px 10px;border-radius:10px;font-size:13px}
.statistics-name span.achievement-locked{background:#f2f2f7;color:#aeaeb2;padding:8px 10px;border-radius:10px;font-size:13px}
.statistics-list>.statistics-row .statistics-name span,.statistics-list~.statistics-row .statistics-name span{background:transparent;padding:0;margin-top:4px}
.statistics-number{font-size:23px;font-weight:700}.statistics-number small{font-size:10px;font-weight:400;color:#8e8e93}
.empty-statistics{background:#fff;border-radius:18px;padding:30px;text-align:center;color:#8e8e93}
.statistics-list+h3+.statistics-row{border:2px solid #ffd76a;background:#fffaf0;box-shadow:0 3px 10px rgba(255,215,106,.18)}
.statistics-list+h3+.statistics-row+.statistics-row{border:2px solid #e5e5e5;background:#fafafa;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.statistics-list+h3+.statistics-row+.statistics-row+.statistics-row{border:2px solid #e8c9a0;background:#fffaf5;box-shadow:0 2px 8px rgba(180,120,60,.06)}
.achievements{margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f2}.achievements-title{font-size:13px;font-weight:600;color:#8e8e93;margin-bottom:7px}.achievements-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.achievement{padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600}.achievement.unlocked{background:#fff4d6;color:#9a6b00}.achievement.locked{background:#f2f2f7;color:#aeaeb2}
.monthly-stats{margin-top:12px}.monthly-row{margin-bottom:14px}.monthly-info{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}.monthly-info strong{font-weight:600}.monthly-bar{height:10px;background:#f2f2f7;border-radius:10px;overflow:hidden}.monthly-bar-fill{height:100%;background:#8e8e93;border-radius:10px}
.stats-window{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);animation:statsFadeIn .2s ease}
.stats-card{position:relative;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;box-sizing:border-box;padding:26px 22px;background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.18);animation:statsSlideUp .25s ease}
.stats-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border:none;border-radius:13px;background:#f2f2f7;color:#3a3a3c;font-size:25px;cursor:pointer}
.stats-icon{width:76px;height:76px;margin:4px auto 14px;border-radius:24px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.stats-card h2{margin-top:6px;font-size:28px;font-weight:750;letter-spacing:-.7px;text-align:center}.big-number{margin-top:18px;padding:20px;border-radius:22px;background:#1c1c1e;color:#fff;text-align:center;font-size:52px;line-height:1;font-weight:800;letter-spacing:-2px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.big-number span{font-size:16px;font-weight:500;color:#b8b8bd;letter-spacing:0}.last-event{margin-top:10px;text-align:center;font-size:13px;color:#8e8e93}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px;margin-bottom:26px}.stat-box{padding:16px 8px;background:#f2f2f7;border-radius:18px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}.stat-box strong{display:block;font-size:24px;font-weight:750;margin-bottom:5px}.stat-box span{display:block;font-size:11px;color:#8e8e93}
.stats-card h3{margin:28px 0 12px;font-size:19px;font-weight:700}.history-list{display:grid;gap:8px}.history-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f7f7f9;border-radius:16px;border:1px solid rgba(0,0,0,.03);font-size:14px}.history-row span{color:#3a3a3c}.history-row strong{padding:5px 9px;border-radius:9px;background:#fff;font-size:13px;font-weight:700}.no-history{padding:18px;text-align:center;color:#8e8e93;background:#f7f7f9;border-radius:14px;font-size:14px}
.goal-message{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:3000;padding:14px 20px;border-radius:16px;background:#1c1c1e;color:#fff;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:goalMessageIn .25s ease}.goal-message-hide{animation:goalMessageOut .4s ease forwards}
@keyframes statsFadeIn{from{opacity:0}to{opacity:1}}@keyframes statsSlideUp{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes goalMessageIn{from{opacity:0;transform:translate(-50%,15px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes goalMessageOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,10px)}}
@media(max-width:500px){.app{padding:20px 15px 40px}h1{font-size:30px;font-weight:700;letter-spacing:-.5px}.counter-card{padding:18px;border-radius:18px}.counter-actions{gap:5px}.counter-actions button{height:38px}.minus-button,.plus-button{width:38px}.summary-grid{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><div class="subtitle">МОИ ЦИФРЫ</div><h1>Счётчики</h1></div><button class="add-button" id="addButton">+</button></header>
<main id="counters"></main>
<div id="emptyState" class="empty-state"><div class="empty-icon">🔢</div><h2>Пока ничего нет</h2><p>Создай свой первый счётчик</p><button class="create-button" id="emptyCreateButton">Создать счётчик</button></div>
</div>
<div class="modal hidden" id="modal"><div class="modal-card"><h2>Новый счётчик</h2><label>Название</label><input id="nameInput" type="text" placeholder="Например, Пицца"><label>Иконка</label><select id="emojiInput">
<option value="🍕">🍕 Пицца</option><option value="🍔">🍔 Бургер</option><option value="🍟">🍟 Фастфуд</option><option value="🍺">🍺 Пиво</option><option value="☕️">☕️ Кофе</option><option value="🥤">🥤 Напитки</option><option value="🍎">🍎 Фрукты</option><option value="🍰">🍰 Сладкое</option><option value="🍦">🍦 Мороженое</option><option value="🎬">🎬 Фильмы</option><option value="🎮">🎮 Игры</option><option value="🎵">🎵 Музыка</option><option value="🎧">🎧 Подкасты</option><option value="📚">📚 Книги</option><option value="🏃">🏃 Бег</option><option value="🚶">🚶 Ходьба</option><option value="🚴">🚴 Велосипед</option><option value="🏋️">🏋️ Тренировки</option><option value="⚽️">⚽️ Спорт</option><option value="🏊">🏊 Плавание</option><option value="💰">💰 Деньги</option><option value="💳">💳 Покупки</option><option value="🛒">🛒 Магазин</option><option value="🏠">🏠 Дом</option><option value="🚗">🚗 Авто</option><option value="✈️">✈️ Путешествия</option><option value="❤️">❤️ Любовь</option><option value="😴">😴 Сон</option><option value="🎯">🎯 Цель</option><option value="⭐️">⭐️ Другое</option>
</select><label>Единица измерения</label><select id="unitInput"><option value="раз">раз</option><option value="км">км</option><option value="часов">часов</option><option value="дней">дней</option><option value="€">€</option><option value="литров">литров</option><option value="страниц">страниц</option></select><label>Цель</label><input id="goalInput" type="number" placeholder="Например, 10" min="1"><div class="modal-buttons"><button class="cancel-button" id="cancelButton">Отмена</button><button class="save-button" id="saveButton">Создать</button></div></div></div>
<div class="modal hidden" id="editModal"><div class="modal-content"><h2>Редактировать счётчик</h2><input type="text" id="editNameInput" placeholder="Название"><select id="editEmojiInput">
<option value="🍕">🍕 Пицца</option><option value="🍔">🍔 Бургер</option><option value="🍟">🍟 Фастфуд</option><option value="🍺">🍺 Пиво</option><option value="☕️">☕️ Кофе</option><option value="🥤">🥤 Напитки</option><option value="🍎">🍎 Фрукты</option><option value="🍰">🍰 Сладкое</option><option value="🍦">🍦 Мороженое</option><option value="🎬">🎬 Фильмы</option><option value="🎮">🎮 Игры</option><option value="🎵">🎵 Музыка</option><option value="🎧">🎧 Подкасты</option><option value="📚">📚 Книги</option><option value="🏃">🏃 Бег</option><option value="🚶">🚶 Ходьба</option><option value="🚴">🚴 Велосипед</option><option value="🏋️">🏋️ Тренировки</option><option value="⚽️">⚽️ Спорт</option><option value="🏊">🏊 Плавание</option><option value="💰">💰 Деньги</option><option value="💳">💳 Покупки</option><option value="🛒">🛒 Магазин</option><option value="🏠">🏠 Дом</option><option value="🚗">🚗 Авто</option><option value="✈️">✈️ Путешествия</option><option value="❤️">❤️ Любовь</option><option value="😴">😴 Сон</option><option value="🎯">🎯 Цель</option><option value="⭐️">⭐️ Другое</option>
</select><select id="editUnitInput"><option value="раз">раз</option><option value="км">км</option><option value="часов">часов</option><option value="дней">дней</option><option value="€">€</option><option value="литров">литров</option><option value="страниц">страниц</option></select><input type="number" id="editCountInput" placeholder="Количество" min="0"><input type="number" id="editGoalInput" placeholder="Цель" min="1"><div class="modal-buttons"><button class="cancel-button" id="editCancelButton">Отмена</button><button class="save-button" id="editSaveButton">Сохранить</button></div></div></div>
<div class="modal hidden" id="deleteModal"><div class="modal-content"><h2>Удалить счётчик?</h2><p id="deleteMessage">Это действие нельзя отменить.</p><div class="modal-buttons"><button class="cancel-button" id="deleteCancelButton">Отмена</button><button class="save-button" id="deleteConfirmButton">Удалить</button></div></div></div>
<script>
const STORAGE_KEY="myLifeCounters";
let counters=JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
const countersContainer=document.getElementById("counters"),emptyState=document.getElementById("emptyState");
const modal=document.getElementById("modal"),addButton=document.getElementById("addButton"),emptyCreateButton=document.getElementById("emptyCreateButton"),cancelButton=document.getElementById("cancelButton"),saveButton=document.getElementById("saveButton");
const nameInput=document.getElementById("nameInput"),emojiInput=document.getElementById("emojiInput"),unitInput=document.getElementById("unitInput"),goalInput=document.getElementById("goalInput");
counters.forEach(c=>{if(!c.history)c.history=[];if(!c.achievements)c.achievements=[];if(c.goal===undefined)c.goal=0});
function saveCounters(){localStorage.setItem(STORAGE_KEY,JSON.stringify(counters))}
function getThisMonthCount(c){const n=new Date();return c.history.filter(i=>{const d=new Date(i.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).length}
function getThisYearCount(c){const n=new Date();return c.history.filter(i=>new Date(i.date).getFullYear()===n.getFullYear()).length}
function getLastDate(c){if(!c.history||!c.history.length)return"Пока нет записей";const d=new Date(c.history[c.history.length-1].date);return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function getCountUnit(count,unit){if(unit!=="раз")return unit;const n=Math.abs(count)%100,l=n%10;if(n>=11&&n<=14)return"раз";if(l===1)return"раз";if(l>=2&&l<=4)return"раза";return"раз"}
function renderCounters(){countersContainer.innerHTML="";if(!counters.length){emptyState.style.display="block";return}emptyState.style.display="none";counters.forEach(c=>{const month=getThisMonthCount(c);const card=document.createElement("div");card.className="counter-card";card.onclick=e=>{if(e.target.tagName==="BUTTON")return;openStats(c.id)};card.innerHTML=`<div class="counter-icon">${c.emoji}</div><div class="counter-info"><div class="counter-name">${c.name}</div><div><span class="counter-value">${c.count}</span><span class="counter-unit">${getCountUnit(c.count,c.unit)}</span>${c.goal>0?`<div style="margin-top:8px"><div style="height:6px;background:#f2f2f7;border-radius:10px;overflow:hidden"><div style="width:${Math.min(c.count/c.goal*100,100)}%;height:100%;background:#9a6b00;border-radius:10px"></div></div><div style="margin-top:4px;font-size:11px;color:#8e8e93">${Math.min(Math.round(c.count/c.goal*100),100)}% · цель ${c.goal}</div></div>`:""}</div><div class="counter-stats">За этот месяц: ${month}<br>Последний раз: ${getLastDate(c)}${c.goal>0?`<br>🎯 Цель: ${c.goal} ${getCountUnit(c.goal,c.unit)}`:""}</div>${c.achievements?.length?`<div class="achievements"><div class="achievements-title">🏆 Достижения</div><div class="achievements-list">${c.achievements.includes("level5")?`<span class="achievement unlocked">🥉 5</span>`:""}${c.achievements.includes("level10")?`<span class="achievement unlocked">🥈 10</span>`:""}${c.achievements.includes("level25")?`<span class="achievement unlocked">🥇 25</span>`:""}${c.achievements.includes("level50")?`<span class="achievement unlocked">🏆 50</span>`:""}${c.achievements.includes("level100")?`<span class="achievement unlocked">🔥 100</span>`:""}</div></div>`:""}</div><div class="counter-actions"><button class="minus-button" onclick="changeCounter(event,${c.id},-1)">−</button><button class="plus-button" onclick="changeCounter(event,${c.id},1)">+</button><button class="edit-button" onclick="editCounter(event,${c.id})">✏️</button><button class="reset-button" onclick="if(confirm('Сбросить счётчик?')) changeCounter(event,${c.id},-${c.count})">↻</button><button class="delete-button" onclick="deleteCounter(event,${c.id})">🗑</button></div>`;countersContainer.appendChild(card)})}
function changeCounter(event,id,amount){event.stopPropagation();const c=counters.find(x=>x.id===id);if(!c)return;c.count+=amount;if(c.count<0)c.count=0;if(amount===1){c.history.push({date:new Date().toISOString()})}if(!c.achievements)c.achievements=[];saveCounters();renderCounters();if(amount===1&&c.count>=5&&!c.achievements.includes("level5")){c.achievements.push("level5");saveCounters();showAchievementMessage("🥉","Первые 5")}if(amount===1&&c.count>=10&&!c.achievements.includes("level10")){c.achievements.push("level10");saveCounters();showAchievementMessage("🥈","Уже привычка")}if(amount===1&&c.count>=25&&!c.achievements.includes("level25")){c.achievements.push("level25");saveCounters();showAchievementMessage("🥇","Серьёзный результат")}if(amount===1&&c.count>=50&&!c.achievements.includes("level50")){c.achievements.push("level50");saveCounters();showAchievementMessage("🏆","Легенда")}if(amount===1&&c.count>=100&&!c.achievements.includes("level100")){c.achievements.push("level100");saveCounters();showAchievementMessage("🔥","Мастер")}if(amount===1&&c.goal>0&&c.count===c.goal)showGoalMessage();if(!statisticsScreen.classList.contains("hidden"))renderGlobalStats()}
function openStats(id){const c=counters.find(x=>x.id===id);if(!c)return;const month=getThisMonthCount(c),year=getThisYearCount(c),last=getLastDate(c),cy=new Date().getFullYear();const months=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],ms={};months.forEach(m=>ms[m]=0);c.history.forEach(i=>{const d=new Date(i.date);if(d.getFullYear()===cy)ms[months[d.getMonth()]]++});const bestMonth=Object.entries(ms).sort((a,b)=>b[1]-a[1])[0];const historyHTML=!c.history.length?`<div class="no-history">Пока нет записей</div>`:[...c.history].reverse().slice(0,20).map(i=>{const d=new Date(i.date);return`<div class="history-row"><span>${d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}</span><strong>+1</strong></div>`}).join("");const w=document.createElement("div");w.className="stats-window";w.innerHTML=`<div class="stats-card"><button class="stats-close">×</button><div class="stats-icon">${c.emoji}</div><h2>${c.name}</h2><div class="big-number">${c.count}<span>${getCountUnit(c.count,c.unit)}</span></div><div class="last-event">Последний раз: ${last}</div><div class="stats-grid"><div class="stat-box"><strong>${month}</strong><span>Этот месяц</span></div><div class="stat-box"><strong>🏆 ${bestMonth[0]}</strong><span>${bestMonth[1]} ${getCountUnit(bestMonth[1],c.unit)}</span></div><div class="stat-box"><strong>${year}</strong><span>Этот год</span></div><div class="stat-box"><strong>${c.count}</strong><span>Всего</span></div></div><h3>История</h3><div class="history-list">${historyHTML}</div><h3>По месяцам</h3><div class="monthly-stats">${Object.entries(ms).filter(([m])=>months.indexOf(m)<=new Date().getMonth()).map(([m,n])=>`<div class="monthly-row"><div class="monthly-info"><span>${m}</span><strong>${n}</strong></div><div class="monthly-bar"><div class="monthly-bar-fill" style="width:${n/Math.max(...Object.values(ms),1)*100}%"></div></div></div>`).join("")}</div></div>`;document.body.appendChild(w);w.querySelector(".stats-close").onclick=()=>w.remove();w.onclick=e=>{if(e.target===w)w.remove()}}
function openModal(){modal.classList.remove("hidden");nameInput.value="";emojiInput.value="🍕";unitInput.value="раз";goalInput.value="";nameInput.focus()}
function closeModal(){modal.classList.add("hidden")}
addButton.addEventListener("click",openModal);emptyCreateButton.addEventListener("click",openModal);cancelButton.addEventListener("click",closeModal);saveButton.addEventListener("click",()=>{const name=nameInput.value.trim();if(!name){alert("Напиши название счётчика");return}counters.push({id:Date.now(),name,emoji:emojiInput.value.trim()||"🔢",unit:unitInput.value.trim(),goal:Number(goalInput.value)||0,count:0,history:[],achievements:[]});saveCounters();renderCounters();closeModal()});modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
const app=document.querySelector(".app"),header=app.querySelector("header"),navigation=document.createElement("div");navigation.className="navigation";navigation.innerHTML=`<button class="nav-button active" id="countersTab">🔢 Счётчики</button><button class="nav-button" id="statsTab">📊 Статистика</button><button class="nav-button" id="achievementsTab">🏆 Достижения</button>`;header.after(navigation);
const statisticsScreen=document.createElement("div");statisticsScreen.className="statistics-screen hidden";app.appendChild(statisticsScreen);const achievementsScreen=document.createElement("div");achievementsScreen.className="statistics-screen hidden";app.appendChild(achievementsScreen);
const countersTab=document.getElementById("countersTab"),statsTab=document.getElementById("statsTab"),achievementsTab=document.getElementById("achievementsTab");
countersTab.addEventListener("click",()=>{countersContainer.style.display="";emptyState.style.display=counters.length?"none":"block";addButton.style.display="";statisticsScreen.classList.add("hidden");achievementsScreen.classList.add("hidden");countersTab.classList.add("active");statsTab.classList.remove("active");achievementsTab.classList.remove("active")});
statsTab.addEventListener("click",()=>{countersContainer.style.display="none";emptyState.style.display="none";addButton.style.display="none";statisticsScreen.classList.remove("hidden");achievementsScreen.classList.add("hidden");countersTab.classList.remove("active");statsTab.classList.add("active");achievementsTab.classList.remove("active");renderGlobalStats()});
achievementsTab.addEventListener("click",()=>{countersContainer.style.display="none";emptyState.style.display="none";addButton.style.display="none";statisticsScreen.classList.add("hidden");achievementsScreen.classList.remove("hidden");countersTab.classList.remove("active");statsTab.classList.remove("active");achievementsTab.classList.add("active");renderAchievements()});
function renderAchievements(){achievementsScreen.innerHTML=`<div class="statistics-title"><h2>Достижения</h2></div><div class="statistics-list">${!counters.length?`<div class="empty-statistics">Пока нет счётчиков</div>`:counters.map(c=>{const a=c.achievements||[];const next=c.count<5?5:c.count<10?10:c.count<25?25:c.count<50?50:c.count<100?100:null;const progress=next?c.count/next*100:100;return`<div class="statistics-row"><div class="statistics-name"><strong>${c.name}</strong><div style="font-size:12px;color:#8e8e93;margin-top:4px">Разблокировано: ${a.length} из 5</div><div style="font-size:12px;color:#8e8e93;margin-top:4px">${next?`До следующего достижения: ${next-c.count}`:"🏆 Все достижения получены!"}</div><div style="margin-top:8px;height:6px;background:#f2f2f7;border-radius:10px;overflow:hidden"><div style="width:${Math.min(progress,100)}%;height:100%;background:#9a6b00;border-radius:10px"></div></div><span class="${a.includes("level5")?"achievement-earned":"achievement-locked"}">${a.includes("level5")?"🥉 5 — Первые 5":"🔒 5 — Первые 5"}</span><span class="${a.includes("level10")?"achievement-earned":"achievement-locked"}">${a.includes("level10")?"🥈 10 — Уже привычка":"🔒 10 — Уже привычка"}</span><span class="${a.includes("level25")?"achievement-earned":"achievement-locked"}">${a.includes("level25")?"🥇 25 — Серьёзный результат":"🔒 25 — Серьёзный результат"}</span><span class="${a.includes("level50")?"achievement-earned":"achievement-locked"}">${a.includes("level50")?"🏆 50 — Легенда":"🔒 50 — Легенда"}</span><span class="${a.includes("level100")?"achievement-earned":"achievement-locked"}">${a.includes("level100")?"🔥 100 — Мастер":"🔒 100 — Мастер"}</span></div></div>`}).join("")}</div>`}
function renderGlobalStats(){let total=0,monthEvents=0;const now=new Date();let best=null;counters.forEach(c=>{if(!c.history)c.history=[];total+=Number(c.count)||0;if(c.history.some(i=>{const d=new Date(i.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()})){}c.history.forEach(i=>{const d=new Date(i.date);if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())monthEvents++})});if(counters.length)best=counters.reduce((b,c)=>Number(c.count)>Number(b.count)?c:b);statisticsScreen.innerHTML=`<div class="statistics-title"><h2>Общая статистика</h2></div><div class="summary-grid"><div class="summary-card"><strong>${counters.length}</strong><span>Счётчиков</span></div><div class="summary-card"><strong>${total}</strong><span>Всего событий</span></div><div class="summary-card"><strong>${monthEvents}</strong><span>В этом месяце</span></div><div class="summary-card"><strong>${best?best.emoji+" "+best.count:"—"}</strong><span>Лучший результат</span></div></div><div class="statistics-list"><h3>Мои счётчики</h3>${!counters.length?`<div class="empty-statistics">Пока нет счётчиков</div>`:counters.map(c=>`<div class="statistics-row" onclick="openStats(Number('${c.id}'))"><div class="statistics-icon">${c.emoji}</div><div class="statistics-name"><strong>${c.name}</strong><span>${getThisMonthCount(c)} за этот месяц</span></div><div class="statistics-number">${c.count}<small>${getCountUnit(c.count,c.unit)}</small></div></div>`).join("")}</div><h3 style="margin-top:24px">🔥 Самые активные</h3>${!counters.length?`<div class="empty-statistics">Пока нет данных</div>`:[...counters].sort((a,b)=>Number(b.count)-Number(a.count)).map((c,i)=>`<div class="statistics-row"><div class="statistics-icon">${i===0?"🥇":i===1?"🥈":"🥉"}</div><div class="statistics-name"><strong>${c.emoji} ${c.name}</strong><span>${c.count} ${getCountUnit(c.count,c.unit)}</span></div></div>`).join("")}`}
const editModal=document.getElementById("editModal"),editNameInput=document.getElementById("editNameInput"),editEmojiInput=document.getElementById("editEmojiInput"),editUnitInput=document.getElementById("editUnitInput"),editCountInput=document.getElementById("editCountInput"),editGoalInput=document.getElementById("editGoalInput"),editCancelButton=document.getElementById("editCancelButton"),editSaveButton=document.getElementById("editSaveButton");let editingCounterId=null;
function editCounter(event,id){event.stopPropagation();const c=counters.find(x=>x.id===id);if(!c)return;editingCounterId=id;editNameInput.value=c.name;editEmojiInput.value=c.emoji;editUnitInput.value=c.unit;editCountInput.value=c.count;editGoalInput.value=c.goal||"";editModal.classList.remove("hidden");editNameInput.focus()}
editCancelButton.addEventListener("click",()=>{editModal.classList.add("hidden");editingCounterId=null});editSaveButton.addEventListener("click",()=>{if(editingCounterId===null)return;const c=counters.find(x=>x.id===editingCounterId);if(!c)return;const name=editNameInput.value.trim();if(!name){alert("Название не может быть пустым");return}c.name=name;c.emoji=editEmojiInput.value.trim()||"🔢";c.unit=editUnitInput.value.trim();c.count=Math.max(0,Number(editCountInput.value)||0);c.goal=Number(editGoalInput.value)||0;saveCounters();renderCounters();editModal.classList.add("hidden");editingCounterId=null});editModal.addEventListener("click",e=>{if(e.target===editModal){editModal.classList.add("hidden");editingCounterId=null}});
const deleteModal=document.getElementById("deleteModal"),deleteMessage=document.getElementById("deleteMessage"),deleteCancelButton=document.getElementById("deleteCancelButton"),deleteConfirmButton=document.getElementById("deleteConfirmButton");let deletingCounterId=null;
function deleteCounter(event,id){event.stopPropagation();const c=counters.find(x=>x.id===id);if(!c)return;deletingCounterId=id;deleteMessage.textContent="Удалить счётчик? Это действие нельзя отменить.";deleteModal.classList.remove("hidden")}
deleteCancelButton.addEventListener("click",()=>{deleteModal.classList.add("hidden");deletingCounterId=null});deleteConfirmButton.addEventListener("click",()=>{if(deletingCounterId===null)return;counters=counters.filter(x=>x.id!==deletingCounterId);saveCounters();renderCounters();deleteModal.classList.add("hidden");deletingCounterId=null});deleteModal.addEventListener("click",e=>{if(e.target===deleteModal){deleteModal.classList.add("hidden");deletingCounterId=null}});
function showGoalMessage(){const m=document.createElement("div");m.className="goal-message";m.textContent="🎯 Цель достигнута!";document.body.appendChild(m);setTimeout(()=>m.classList.add("goal-message-hide"),1800);setTimeout(()=>m.remove(),2200)}
function showAchievementMessage(icon,text){const m=document.createElement("div");m.className="goal-message";m.textContent=`🏆 Новое достижение! ${icon} ${text}`;document.body.appendChild(m);setTimeout(()=>m.classList.add("goal-message-hide"),1800);setTimeout(()=>m.remove(),2200)}
window.changeCounter=changeCounter;window.deleteCounter=deleteCounter;window.editCounter=editCounter;window.openStats=openStats;
renderCounters();
